<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开局觉醒超神级天赋2</title>
  <link rel="stylesheet" href="styles.css?v=1.1.6">
  <style>
    [hidden] { display: none !important; }
    .boot-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 24px;
      color: #eadcc7;
      background: #0b0908;
      opacity: 0;
      animation: boot-reveal 0s linear 0.25s forwards;
    }
    .boot-panel {
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      padding: 32px 24px 28px;
      text-align: center;
      background: linear-gradient(180deg, #241b15 0%, #17110e 100%);
      border: 1px solid #6d5132;
      border-radius: 12px;
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.46);
    }
    .boot-sigil {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border: 2px solid #c9a760;
      transform: rotate(45deg);
      box-shadow: 0 0 24px rgba(201, 167, 96, 0.24);
    }
    .boot-sigil::after {
      content: "";
      display: block;
      width: 14px;
      height: 14px;
      margin: 13px;
      background: #c9a760;
    }
    .boot-panel h1 {
      margin: 0 0 12px;
      color: #f0d89b;
      font-size: 28px;
      letter-spacing: 0.12em;
    }
    .boot-panel p {
      margin: 8px 0;
      color: #cbb79a;
      font-size: 16px;
      line-height: 1.7;
    }
    .boot-loader {
      width: 28px;
      height: 28px;
      margin: 20px auto 0;
      border: 3px solid rgba(201, 167, 96, 0.22);
      border-top-color: #c9a760;
      border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    .boot-failure-copy h2 {
      margin: 18px 0 10px;
      color: #e8c56f;
      font-size: 22px;
    }
    .boot-error-detail {
      margin: 14px 0 0;
      color: #8f806e;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }
    .boot-retry {
      width: 100%;
      min-height: 48px;
      margin-top: 20px;
      color: #1a120d;
      font: inherit;
      font-weight: 800;
      background: linear-gradient(180deg, #e1c77e 0%, #b99243 100%);
      border: 1px solid #f3dfa4;
      border-radius: 8px;
    }
    .boot-retry:active { transform: translateY(1px); }
    @keyframes boot-reveal { to { opacity: 1; } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .boot-shell { animation-delay: 0s; }
      .boot-loader { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="boot-shell" class="boot-shell" aria-live="polite">
      <section class="boot-panel">
        <div class="boot-sigil" aria-hidden="true"></div>
        <h1>永恒之塔</h1>
        <div id="boot-loading-copy">
          <p>正在启动游戏……</p>
          <div class="boot-loader" aria-hidden="true"></div>
        </div>
        <div id="boot-failure-copy" class="boot-failure-copy" hidden>
          <h2>游戏启动失败</h2>
          <p>请先更新 Android System WebView 或 Chrome，然后重新打开游戏。</p>
          <p id="boot-error-detail" class="boot-error-detail"></p>
          <button id="boot-retry" class="boot-retry" type="button">重新尝试</button>
        </div>
      </section>
    </main>
  </div>

  <audio id="bgm-city" data-src="assets/audio/bgm_city_v2_thirteen_stars_candidate_20260812.mp3" loop preload="none"></audio>
  <audio id="bgm-tower" data-src="assets/audio/bgm_tower_v2_faded_heroes_candidate_20260812.mp3" loop preload="none"></audio>
  <audio id="bgm-battle" data-src="assets/audio/bgm_battle_v2_thirteen_stars_candidate_20260812.mp3" loop preload="none"></audio>

  <script src="compat.js?v=1.1.6"></script>
  <script src="game.js?v=1.1.6"></script>
</body>
</html>
